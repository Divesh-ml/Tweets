{% extends "layout.html" %}

{% block title %}
tweets
{% endblock %}

{% block content %}

<h1 class="text-center text-white mt-4">Welcome to tweets</h1>

<h2 class="text-white text-center mt-3">
    {% if form.instance.pk %}
        Edit Tweet 
    {% else %}
        Create tweet 
    {% endif %}
</h2>

<div class="container mt-4 text-white">
    <form method="post" enctype="multipart/form-data" class="form">
        
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button class="btn btn-warning" type="submit">Submit</button>
    </form>
    
    <div class="mt-3">
        <a href="{% url 'tweet_list' %}" class="text-decoration-none">Back to tweet list</a>
    </div>
</div>

{% endblock %}
